<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BI MT Delivery</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root { --blue:#1553A4; --gold:#F7B500; --ink:#263238; --bg:#f4f6fa; --card:#fff; --muted:#6b7280; --ok:#16a34a; --warn:#d97706; --ko:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--blue); color:#fff; padding:14px 20px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
  header h1 { margin:0; font-size:19px; } header h1 span { color:var(--gold); }
  main { max-width:1280px; margin:0 auto; padding:18px 20px 40px; }
  .btn { background:var(--gold); color:var(--ink); border:0; padding:9px 14px; border-radius:8px; font-weight:600; cursor:pointer; }
  .btn.alt { background:#fff; color:var(--blue); }
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; }
  select, input { padding:7px; border-radius:8px; border:1px solid #cbd5e1; background:#fff; font:inherit; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .tab { background:#fff; border:1px solid #d6dce6; color:var(--blue); padding:8px 14px; border-radius:999px; cursor:pointer; font:inherit; }
  .tab.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:16px; }
  .kpi { background:var(--card); border-radius:12px; padding:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); border-top:4px solid var(--blue); }
  .kpi.gold { border-top-color:var(--gold); }
  .kpi .label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.3px; }
  .kpi .value { font-size:24px; font-weight:700; margin-top:4px; }
  .kpi .sub { font-size:12px; color:var(--muted); margin-top:2px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .grid .full { grid-column:1/-1; }
  @media (max-width:800px) { .grid { grid-template-columns:1fr; } }
  .card { background:var(--card); border-radius:12px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .card h2 { font-size:14px; margin:0 0 10px; color:var(--blue); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:7px 6px; border-bottom:1px solid #e5e7eb; }
  th { color:var(--muted); font-size:11px; text-transform:uppercase; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .bar-row { display:flex; align-items:center; gap:8px; margin:5px 0; font-size:13px; }
  .bar-row .name { width:140px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-row .track { flex:1; background:#e5e7eb; border-radius:6px; height:12px; overflow:hidden; }
  .bar-row .fill { background:var(--blue); height:100%; }
  .bar-row .val { width:110px; text-align:right; font-variant-numeric:tabular-nums; }
  .alert { padding:9px 12px; border-radius:8px; margin-bottom:8px; font-size:13px; }
  .alert.ko { background:#fee2e2; color:#7f1d1d; } .alert.ok { background:#dcfce7; color:#14532d; } .alert.warn { background:#fef3c7; color:#78350f; }
  .hint { color:var(--muted); font-size:12px; }
  .empty { text-align:center; padding:50px 20px; color:var(--muted); }
  svg text { font-size:10px; fill:var(--muted); }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; color:#fff; }
</style>
</head>
<body>
<header>
  <h1>BI <span>MT Delivery</span></h1>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <input type="file" id="file" accept=".csv,.xlsx,.xls,text/csv" hidden>
    <button class="btn" onclick="document.getElementById('file').click()">Importer CSV / Excel</button>
    <button class="btn alt" onclick="loadDemo()">Données de démo</button>
  </div>
</header>

<main>
  <div class="toolbar">
    <label>Zone <select id="fZone" onchange="render()"><option value="">Toutes</option></select></label>
    <label>Du <input type="date" id="fFrom" onchange="render()"></label>
    <label>Au <input type="date" id="fTo" onchange="render()"></label>
    <label>Objectif commandes/mois <input type="number" id="objCmd" value="3000" style="width:90px" onchange="render()"></label>
    <label>Seuil réussite % <input type="number" id="objOk" value="85" style="width:70px" onchange="render()"></label>
    <span class="hint" id="info"></span>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="content"><div class="empty">Importez un fichier CSV ou Excel, ou cliquez sur « Données de démo ».</div></div>

  <p class="hint" style="margin-top:22px">
    Colonnes reconnues (noms souples) : <b>date</b>, <b>zone</b>, <b>statut</b> (livree / annulee / echec), <b>frais</b> (DA), <b>livreur</b>, <b>restaurant</b>, <b>client</b> (nom ou téléphone), <b>cout</b> (coût de la course, DA), <b>motif</b> (cause d'échec), <b>delai</b> (minutes).
  </p>
</main>

<script>
let rows = [];
let tab = 'ops';

const COL = {
  date:['date','jour','created','date_commande'], zone:['zone','secteur','region'], statut:['statut','status','etat'],
  frais:['frais','montant','prix','fee','total'], livreur:['livreur','driver','coursier'], restaurant:['restaurant','partenaire','shop','marchand'],
  client:['client','customer','telephone','tel'], cout:['cout','coût','cost','cout_course'], motif:['motif','raison','cause','reason'], delai:['delai','délai','duree','minutes']
};
const TABS = [['ops','Opérations'],['fin','Finances'],['liv','Livreurs'],['zon','Zones'],['mtf','MT Food'],['cli','Clients'],['alr','Alertes']];

function norm(s){ return (s||'').toString().trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,'_'); }
function findCol(h, keys){ const n=h.map(norm); for(const k of keys){ const i=n.findIndex(x=>x===k||x.includes(k)); if(i>=0) return i; } return -1; }
function num(s){ return parseFloat(String(s||'0').replace(',','.').replace(/[^\d.\-]/g,''))||0; }

function parseCSV(text){
  const lines = text.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if(!lines.length) return [];
  const sep = lines[0].split(';').length > lines[0].split(',').length ? ';' : ',';
  const h = lines[0].split(sep); const idx={};
  for(const k in COL) idx[k]=findCol(h,COL[k]);
  return lines.slice(1).map(l=>{
    const c=l.split(sep); const g=k=>idx[k]>=0?(c[idx[k]]||'').trim():'';
    const d=new Date(g('date'));
    return { date: isNaN(d)?null:d, zone:g('zone')||'Non renseignée', statut:norm(g('statut'))||'inconnu',
      frais:num(g('frais')), livreur:g('livreur')||'Non renseigné', restaurant:g('restaurant'),
      client:g('client'), cout:num(g('cout')), motif:g('motif'), delai:num(g('delai')) };
  }).filter(r=>r.date);
}

function fromSheet(ws){
  const csv = XLSX.utils.sheet_to_csv(ws,{FS:','});
  return csv;
}

const isOk = s => /livr|done|delivered|succes/.test(s);
const isFail = s => /echec|annul|retour|cancel|fail/.test(s);
const fmt = n => Math.round(n).toLocaleString('fr-FR');
const pct = (a,b) => b ? (a/b*100) : 0;
const day = d => d.toISOString().slice(0,10);
const month = d => d.toISOString().slice(0,7);

function filtered(){
  const z=document.getElementById('fZone').value, f=document.getElementById('fFrom').value, t=document.getElementById('fTo').value;
  return rows.filter(r=>(!z||r.zone===z)&&(!f||r.date>=new Date(f))&&(!t||r.date<=new Date(t+'T23:59:59')));
}

function summary(list){
  const ok=list.filter(r=>isOk(r.statut)), ko=list.filter(r=>isFail(r.statut));
  const ca=ok.reduce((s,r)=>s+r.frais,0), cost=ok.reduce((s,r)=>s+r.cout,0);
  return { n:list.length, ok:ok.length, ko:ko.length, ca, cost, marge:ca-cost,
    taux:pct(ok.length,list.length), panier: ok.length?ca/ok.length:0,
    livreurs:new Set(list.map(r=>r.livreur)).size, clients:new Set(list.map(r=>r.client).filter(Boolean)).size };
}

function groupBy(list,key){
  const m={};
  for(const r of list){ const k=key(r); if(!k) continue; (m[k]=m[k]||[]).push(r); }
  return m;
}

function bars(map, title, valFn, unit){
  const entries=Object.entries(map).map(([k,v])=>[k,valFn(v)]).sort((a,b)=>b[1]-a[1]).slice(0,15);
  const max=Math.max(1,...entries.map(e=>e[1]));
  return `<div class="card"><h2>${title}</h2>` + (entries.length?entries.map(([k,v])=>
    `<div class="bar-row"><div class="name" title="${k}">${k}</div><div class="track"><div class="fill" style="width:${(v/max*100).toFixed(1)}%"></div></div><div class="val">${fmt(v)} ${unit}</div></div>`).join(''):'<p class="hint">Aucune donnée</p>')+`</div>`;
}

function lineChart(points, title){
  if(!points.length) return '';
  const W=600,H=170,P=28; const max=Math.max(1,...points.map(p=>p.v));
  const step=points.length>1?(W-2*P)/(points.length-1):0;
  const xy=points.map((p,i)=>[P+i*step, H-P-(p.v/max)*(H-2*P)]);
  const path=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const labels=points.filter((_,i)=>i%Math.ceil(points.length/6)===0).map((p)=>{const i=points.indexOf(p);return `<text x="${xy[i][0].toFixed(1)}" y="${H-6}" text-anchor="middle">${p.k}</text>`;}).join('');
  return `<div class="card full"><h2>${title}</h2><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="#d6dce6"/>
    <path d="${path}" fill="none" stroke="#1553A4" stroke-width="2.5"/>
    ${xy.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#F7B500"/>`).join('')}
    <text x="4" y="${P}">${fmt(max)}</text><text x="4" y="${H-P}">0</text>${labels}</svg></div>`;
}

function kpi(label,value,sub,gold){ return `<div class="kpi ${gold?'gold':''}"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub||''}</div></div>`; }

function render(){
  const zones=[...new Set(rows.map(r=>r.zone))].sort();
  const sel=document.getElementById('fZone'), cur=sel.value;
  sel.innerHTML='<option value="">Toutes</option>'+zones.map(z=>`<option ${z===cur?'selected':''}>${z}</option>`).join('');
  document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab ${k===tab?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('');
  if(!rows.length) return;
  const list=filtered(), S=summary(list);
  document.getElementById('info').textContent=`${S.n} commande(s) sur ${rows.length}`;
  const objCmd=+document.getElementById('objCmd').value||0, objOk=+document.getElementById('objOk').value||0;
  const byDay=groupBy(list,day), days=Object.keys(byDay).sort();
  const byMonth=groupBy(list,month), months=Object.keys(byMonth).sort();
  const byZone=groupBy(list,r=>r.zone), byDriver=groupBy(list,r=>r.livreur), byResto=groupBy(list.filter(r=>r.restaurant),r=>r.restaurant);
  const byClient=groupBy(list.filter(r=>r.client),r=>r.client);
  const cmdPerDay=days.map(d=>({k:d.slice(5),v:byDay[d].length}));
  const caPerDay=days.map(d=>({k:d.slice(5),v:byDay[d].filter(r=>isOk(r.statut)).reduce((s,r)=>s+r.frais,0)}));
  let html='';

  if(tab==='ops'){
    html+=`<div class="kpis">
      ${kpi('Commandes',fmt(S.n),'sur la période',false)}
      ${kpi('Taux de réussite',S.taux.toFixed(1)+'%',`objectif ${objOk}%`,true)}
      ${kpi('Livrées',fmt(S.ok),'')}
      ${kpi('Échecs / annulations',fmt(S.ko),pct(S.ko,S.n).toFixed(1)+'% du total',false)}
      ${kpi('Délai moyen',(list.filter(r=>r.delai).reduce((s,r)=>s+r.delai,0)/(list.filter(r=>r.delai).length||1)).toFixed(0)+' min','si colonne délai',true)}
      ${kpi('Jours actifs',days.length,'',false)}</div>`;
    html+=lineChart(cmdPerDay,'Commandes par jour');
    const motifs=groupBy(list.filter(r=>isFail(r.statut)&&r.motif),r=>r.motif);
    html+=`<div class="grid">${bars(byZone,'Commandes par zone',v=>v.length,'cmd')}${bars(motifs,'Causes des échecs',v=>v.length,'cas')}</div>`;
  }

  if(tab==='fin'){
    html+=`<div class="kpis">
      ${kpi("Chiffre d'affaires livré",fmt(S.ca)+' DA','',true)}
      ${kpi('Panier moyen',fmt(S.panier)+' DA','par livraison réussie',false)}
      ${kpi('Coût des courses',fmt(S.cost)+' DA','si colonne coût',false)}
      ${kpi('Marge estimée',fmt(S.marge)+' DA',S.ca?pct(S.marge,S.ca).toFixed(1)+'% du CA':'',true)}</div>`;
    html+=lineChart(caPerDay,'Chiffre d\'affaires livré par jour');
    const caMonth=months.map(m=>({k:m,v:byMonth[m].filter(r=>isOk(r.statut)).reduce((s,r)=>s+r.frais,0)}));
    html+=lineChart(caMonth,'Chiffre d\'affaires par mois');
    html+=`<div class="grid">${bars(byZone,'CA par zone',v=>v.filter(r=>isOk(r.statut)).reduce((s,r)=>s+r.frais,0),'DA')}</div>`;
  }

  if(tab==='liv'){
    const rowsD=Object.entries(byDriver).map(([d,v])=>{const s=summary(v);return `<tr><td>${d}</td><td class="num">${s.n}</td><td class="num">${s.ok}</td><td class="num">${s.ko}</td><td class="num">${s.taux.toFixed(0)}%</td><td class="num">${fmt(s.ca)} DA</td></tr>`;}).join('');
    html+=`<div class="kpis">${kpi('Livreurs actifs',S.livreurs,'',true)}${kpi('Courses / livreur',fmt(S.n/(S.livreurs||1)),'moyenne',false)}</div>`;
    html+=`<div class="grid">${bars(byDriver,'Courses par livreur',v=>v.length,'cmd')}${bars(byDriver,'Taux de réussite par livreur',v=>summary(v).taux,'%')}
      <div class="card full"><h2>Détail par livreur</h2><table><tr><th>Livreur</th><th class="num">Cmd</th><th class="num">Livrées</th><th class="num">Échecs</th><th class="num">Réussite</th><th class="num">CA</th></tr>${rowsD}</table></div></div>`;
  }

  if(tab==='zon'){
    const rowsZ=Object.entries(byZone).map(([z,v])=>{const s=summary(v);return `<tr><td>${z}</td><td class="num">${s.n}</td><td class="num">${s.ok}</td><td class="num">${s.taux.toFixed(0)}%</td><td class="num">${fmt(s.ca)} DA</td><td class="num">${fmt(s.panier)} DA</td></tr>`;}).join('');
    html+=`<div class="grid">${bars(byZone,'Commandes par zone',v=>v.length,'cmd')}${bars(byZone,'Réussite par zone',v=>summary(v).taux,'%')}
      <div class="card full"><h2>Performance par zone</h2><table><tr><th>Zone</th><th class="num">Cmd</th><th class="num">Livrées</th><th class="num">Réussite</th><th class="num">CA</th><th class="num">Panier</th></tr>${rowsZ}</table></div></div>`;
  }

  if(tab==='mtf'){
    const rowsR=Object.entries(byResto).map(([r,v])=>{const s=summary(v);return `<tr><td>${r}</td><td class="num">${s.n}</td><td class="num">${s.ok}</td><td class="num">${fmt(s.ca)} DA</td></tr>`;}).join('');
    html+=`<div class="kpis">${kpi('Commandes MT Food',fmt(list.filter(r=>r.restaurant).length),'avec restaurant',true)}${kpi('Restaurants actifs',Object.keys(byResto).length,'',false)}</div>`;
    html+=`<div class="grid">${bars(byResto,'Commandes par restaurant',v=>v.length,'cmd')}
      <div class="card"><h2>Détail par restaurant</h2><table><tr><th>Restaurant</th><th class="num">Cmd</th><th class="num">Livrées</th><th class="num">CA</th></tr>${rowsR||'<tr><td colspan=4 class="hint">Aucune donnée restaurant</td></tr>'}</table></div></div>`;
  }

  if(tab==='cli'){
    const repeat=Object.values(byClient).filter(v=>v.length>1).length;
    const top=Object.entries(byClient).map(([c,v])=>[c,v.length,v.filter(r=>isOk(r.statut)).reduce((s,r)=>s+r.frais,0)]).sort((a,b)=>b[1]-a[1]).slice(0,20);
    html+=`<div class="kpis">${kpi('Clients uniques',fmt(Object.keys(byClient).length),'',true)}${kpi('Clients récurrents',fmt(repeat),pct(repeat,Object.keys(byClient).length).toFixed(0)+'% des clients',false)}${kpi('Commandes par client',(list.filter(r=>r.client).length/(Object.keys(byClient).length||1)).toFixed(1),'moyenne',false)}</div>`;
    html+=`<div class="card"><h2>Top 20 clients</h2><table><tr><th>Client</th><th class="num">Commandes</th><th class="num">CA</th></tr>${top.map(t=>`<tr><td>${t[0]}</td><td class="num">${t[1]}</td><td class="num">${fmt(t[2])} DA</td></tr>`).join('')||'<tr><td colspan=3 class="hint">Colonne client absente</td></tr>'}</table></div>`;
  }

  if(tab==='alr'){
    const alerts=[];
    alerts.push(S.taux>=objOk?`<div class="alert ok">Taux de réussite ${S.taux.toFixed(1)}% : objectif ${objOk}% atteint.</div>`:`<div class="alert ko">Taux de réussite ${S.taux.toFixed(1)}% : sous l'objectif de ${objOk}%.</div>`);
    const mNow=months[months.length-1]; const nowCount=mNow?byMonth[mNow].length:0;
    if(objCmd&&mNow) alerts.push(nowCount>=objCmd?`<div class="alert ok">${mNow} : ${nowCount} commandes, objectif ${objCmd} atteint.</div>`:`<div class="alert warn">${mNow} : ${nowCount} commandes sur ${objCmd} (${pct(nowCount,objCmd).toFixed(0)}%).</div>`);
    for(const [z,v] of Object.entries(byZone)){ const s=summary(v); if(v.length>=5&&s.taux<objOk) alerts.push(`<div class="alert warn">Zone ${z} : réussite ${s.taux.toFixed(0)}% (${v.length} commandes).</div>`); }
    for(const [d,v] of Object.entries(byDriver)){ const s=summary(v); if(v.length>=5&&s.taux<70) alerts.push(`<div class="alert ko">Livreur ${d} : réussite ${s.taux.toFixed(0)}%.</div>`); }
    html+=`<div class="card">${alerts.join('')}</div>`;
  }

  document.getElementById('content').innerHTML=html;
}

document.getElementById('file').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const reader=new FileReader();
  if(/\.(xlsx|xls)$/i.test(f.name)){
    reader.onload=ev=>{ const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true}); rows=parseCSV(fromSheet(wb.Sheets[wb.SheetNames[0]])); render(); };
    reader.readAsArrayBuffer(f);
  } else {
    reader.onload=ev=>{ rows=parseCSV(ev.target.result); render(); };
    reader.readAsText(f,'utf-8');
  }
});

function loadDemo(){
  const zones=['Meftah Centre','Meftah Dehors','Beaulieu'], drivers=['Karim','Yacine','Amine','Sofiane','Nabil'];
  const restos=['Restaurant A','Restaurant B','Pizzeria C'], statuts=['livree','livree','livree','livree','annulee','echec'];
  const motifs=['client absent','adresse introuvable','refus','retard'];
  const start=new Date(); start.setDate(start.getDate()-90); const out=[];
  for(let i=0;i<900;i++){
    const d=new Date(start.getTime()+Math.random()*90*86400000);
    const z=zones[Math.floor(Math.random()*3)]; const st=statuts[Math.floor(Math.random()*statuts.length)];
    out.push({date:d,zone:z,statut:st,frais:z==='Meftah Centre'?150:z==='Meftah Dehors'?200:250,
      livreur:drivers[Math.floor(Math.random()*5)],restaurant:Math.random()<0.4?restos[Math.floor(Math.random()*3)]:'',
      client:'C'+Math.floor(Math.random()*300),cout:z==='Meftah Centre'?80:z==='Meftah Dehors'?110:140,
      motif:isFail(st)?motifs[Math.floor(Math.random()*motifs.length)]:'',delai:20+Math.floor(Math.random()*50)});
  }
  rows=out; render();
}

render();
</script>
</body>
</html>
